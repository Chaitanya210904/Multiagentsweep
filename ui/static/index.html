<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Repository Analyzer — Multi-Agent AI Platform</title>
  <meta name="description" content="Multi-Agent AI Platform: Unified Codebase Comprehension, Verification, and Transformation Dashboard">
  
  <!-- Modern Typography Preconnect -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
  
  <!-- Stylesheet -->
  <link rel="stylesheet" href="/style.css">
</head>
<body>

  <!-- Full-bleed Aesthetic Background Container -->
  <div class="app-background-layer" aria-hidden="true">
    <div class="bg-image"></div>
    <div class="bg-mesh-fallback"></div>
    <div class="bg-grain"></div>
    <div class="bg-wash"></div>
  </div>

  <!-- Root Application Shell -->
  <div id="app" class="app-shell" data-state="idle">

    <!-- SLIM TOP BAR (Animates down in State 2: Analysis) -->
    <header id="topBar" class="top-bar" aria-label="Analysis navigation">
      <div class="top-bar-left">
        <a href="#" class="top-bar-brand" aria-label="Repository Analyzer Home">
          <span class="brand-glyph">✦</span>
          <span>Repository Analyzer</span>
        </a>
        <a id="activeRepoLink" href="#" target="_blank" rel="noopener noreferrer" class="active-repo-badge" title="Open repository in new tab">
          <span class="repo-icon">📦</span>
          <span id="activeRepoName">github.com/owner/repository</span>
          <span class="external-link-icon">↗</span>
        </a>
      </div>

      <div class="top-bar-center">
        <div id="topBarStatus" class="top-bar-status is-active" aria-live="polite">
          Initializing analysis pipeline...
        </div>
      </div>

      <div class="top-bar-right">
        <!-- Download Registry Button & Dropdown in Top Bar -->
        <div class="top-bar-download-group">
          <button type="button" id="btnTopBarDownloadRegistry" class="btn-topbar-download" title="Download Code Registry extraction (JSON & CSV)">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4m4-5 5 5 5-5m-5 5V3"/></svg>
            <span>Download Registry</span>
          </button>
          <div class="topbar-download-dropdown" id="topBarDownloadDropdown" style="display:none;">
            <button type="button" class="dropdown-item" id="btnTopBarDlCsv">
              <span class="item-ext">.CSV</span> Functions & Call Relations (Calls, Called By, Lines)
            </button>
            <button type="button" class="dropdown-item" id="btnTopBarDlCallGraphCsv">
              <span class="item-ext">.CSV</span> Call Graph Matrix (Who Calls What row-by-row)
            </button>
            <button type="button" class="dropdown-item" id="btnTopBarDlJson">
              <span class="item-ext">.JSON</span> Full Code Registry & Graph (AST, Hashes, Edges)
            </button>
          </div>
        </div>

        <button type="button" id="streamModeToggle" class="btn-mode-toggle" title="Switch between Interactive Demo Stream and Live Backend API">
          Mode: Demo Stream
        </button>
        <button type="button" id="btnThemeToggle" class="btn-theme-toggle" title="Toggle Light / Dark mode" aria-label="Toggle theme">
          <span class="theme-icon">☀️</span>
        </button>
        <button type="button" id="btnNewAnalysis" class="btn-new-analysis" title="Return to Landing and analyze another repository">
          <span>←</span> New Analysis
        </button>
      </div>

      <!-- Thin Overall Progress Bar along top bar border -->
      <div class="top-bar-progress-track">
        <div id="analysisProgressBar" class="top-bar-progress-fill" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></div>
      </div>
    </header>

    <!-- ====================================================================
         STATE 1: MINIMAL LANDING VIEW (Default on open)
         Shows ONLY centered input, "Analyze Repository" button, wordmark, tagline.
         Nothing else: no sidebar, no navbar, no stats, no cards, no widgets.
         ==================================================================== -->
    <main id="landingView" class="landing-view" aria-label="Repository submission">
      <div class="landing-card">
        
        <!-- Refined Editorial Wordmark & Tagline -->
        <h1 class="landing-wordmark">
          <span class="wordmark-glyph">✦</span> Repository Analyzer
        </h1>
        <p class="landing-tagline">
          Multi-Agent AI Platform for autonomous codebase comprehension, architecture mapping, and security verification.
        </p>

        <!-- Centered Input Form -->
        <form id="landingForm" class="landing-form" novalidate>
          <div class="repo-input-wrapper">
            <span class="repo-input-icon" aria-hidden="true">☊</span>
            <input 
              type="text" 
              id="repoUrlInput" 
              class="repo-input-field" 
              placeholder="Paste a GitHub repository link…" 
              autocomplete="off" 
              spellcheck="false"
              aria-label="Repository URL"
              aria-describedby="inputError"
              autofocus
            >
          </div>

          <!-- Gentle Inline Error Message -->
          <div id="inputError" class="repo-input-error" role="alert" aria-live="polite"></div>

          <!-- Primary Submit Button -->
          <button type="submit" id="btnAnalyze" class="btn-analyze-primary" disabled>
            <span>Analyze Repository</span>
            <span aria-hidden="true">→</span>
          </button>
        </form>

        <!-- Curated Public Sample Chips -->
        <div id="quickChipsContainer" class="quick-chips-wrapper"></div>
      </div>
    </main>

    <!-- ====================================================================
         STATE 2: ANALYSIS WORKSPACE (Fades/slides in after submission)
         5 Real-time panels in responsive editorial grid:
         1. Pipeline DAG
         2. Live Graph
         3. Agents Feed & Traces
         4. Critic Review & Findings
         5. Final Summary
         ==================================================================== -->
    <main id="analysisView" class="analysis-view" aria-label="Analysis workspace">
      <div class="analysis-grid">

        <!-- Left Column: Architecture & Structure Flow -->
        <div class="grid-col">
          
          <!-- PANEL 1: Pipeline DAG -->
          <section id="panelPipelineDAG" class="panel-card" aria-label="Analysis pipeline directed acyclic graph"></section>

          <!-- PANEL 2: Live Graph -->
          <section id="panelLiveGraph" class="panel-card" aria-label="Live interactive repository code graph"></section>

        </div>

        <!-- Right Column: Verification, Intelligence & Summary -->
        <div class="grid-col">

          <!-- PANEL 5: Final Summary -->
          <section id="panelSummary" class="panel-card" aria-label="Executive summary and audit score"></section>

          <!-- PANEL 4: Critic Review -->
          <section id="panelCriticReview" class="panel-card" aria-label="Critic findings and code remediation"></section>

          <!-- PANEL 3: Agents Panel & Traces -->
          <section id="panelAgentFeed" class="panel-card" aria-label="Live autonomous agents activity feed"></section>

        </div>

      </div>
    </main>

    <!-- Error State Overlay -->
    <div id="errorView" class="error-view" aria-live="assertive">
      <div class="error-card">
        <span class="error-icon">⚠️</span>
        <h3 class="error-title">Analysis Failed</h3>
        <p id="errorMessageText" class="error-message">Unable to clone or parse the requested repository.</p>
        <div class="error-actions">
          <button type="button" id="btnRetryAnalysis" class="btn-analyze-primary" style="width:auto; padding:0.65rem 1.4rem;">
            Retry Analysis
          </button>
          <button type="button" id="btnErrorReturn" class="btn-new-analysis">
            Change Repository
          </button>
        </div>
      </div>
    </div>

  </div>

  <!-- Toast Container -->
  <div id="appToast" class="app-toast" role="status" aria-live="polite"></div>

  <!-- Application Orchestrator Script -->
  <script type="module" src="/app.js"></script>
</body>
</html>
